<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Portfolio Clémence</title>
  <link rel="stylesheet" href="style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;700&display=swap" rel="stylesheet">
  <!-- GSAP CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
</head>
<body>
  <!-- Menu / Header -->
  <header class="main-header">
    <div class="header-flex">
      <div class="logo">
        <img src="img/logo.png" alt="LOGO">
      </div>
      <div class="burger">
        <span></span>
        <span></span>
        <span></span>
      </div>
      <nav>
        <ul class="menu">
          <li><a href="#apropos">À propos</a></li>
          <li><a href="#portfolio">Portfolio</a></li>
          <li><a href="#contact">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Hero -->
  <section class="hero">
    <img src="img/HERO.png" alt="hero" class="hero-cover">
  </section>

  <!-- Présentation -->
  <section id="apropos" class="about-image container">
    <img src="img/presentation.png" alt="présentation">
    <img src="img/enchantee.png" alt="enchantée">
  </section>

  <!-- Portfolio -->
<section id="portfolio" class="portfolio-section">
  <h2 class="portfolio-title">PORTFOLIO</h2>

  <div class="box" id="projects-carousel"></div>

</section>



  <!-- Contact -->
  <section id="contact" class="contact">
  <img src="img/CONATCT2.png" alt="contact">
  </section>

  <footer>
    <p>&copy; 2025 Clémence Cassinado. Tous droits réservés.</p>
  </footer>

  <div id="modal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <div id="modal-images"></div>
      <button class="close-arrow" aria-label="Fermer"&#8592;>
        <svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="#c8d9e6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>

    </div>
  </div>


  <script src="script.js"></script>
</body>
</html>
